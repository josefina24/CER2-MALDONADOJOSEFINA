{% extends 'base.html' %}
{% block contenido %}
  <main class="container py-4">
    <h1>Solicitud de adopción</h1>
    <p>Para adoptar, escribe a huellasdelpuerto@gmail.com indicando la mascota que te interesa.</p>
    <form class="bg-white p-4 rounded" action="{% url 'adopcion' %}#aviso-envio" method="get" autocomplete="off">
      <div class="mb-3">
        <label class="form-label" for="nombre">Nombre completo</label>
        <input class="form-control" id="nombre" type="text" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="correo">Correo electrónico</label>
        <input class="form-control" id="correo" type="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="telefono">Teléfono</label>
        <input class="form-control" id="telefono" type="tel" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="mascota">Mascota de interés</label>
        <select class="form-select" id="mascota" required>
          <option value="">Selecciona una mascota</option>
          {% for mascota in mascotas %}<option>{{ mascota.nombre }}</option>{% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label" for="edad">Edad (18 años o más)</label>
        <input class="form-control" id="edad" type="number" min="18" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="vivienda">Tipo de vivienda</label>
        <select class="form-select" id="vivienda" required>
          <option value="">Selecciona una opción</option>
          <option>Casa</option>
          <option>Departamento</option>
          <option>Otro</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label" for="otras-mascotas">¿Tienes otras mascotas actualmente?</label>
        <select class="form-select" id="otras-mascotas" required>
          <option value="">Selecciona una opción</option>
          <option>Sí</option>
          <option>No</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label" for="motivo">Motivo de la adopción o comentarios</label>
        <textarea class="form-control" id="motivo" rows="4" required></textarea>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" id="compromiso" type="checkbox" required>
        <label class="form-check-label" for="compromiso">Acepto dar alimento, cuidados, atención veterinaria y un hogar
          seguro durante toda la vida del animal.</label>
      </div>
      <button class="btn btn-principal" type="submit">Probar formulario</button>
    </form>
    <div id="aviso-envio" class="aviso-envio shadow" role="status">Demostración terminada. No se envió ni guardó una solicitud.</div>
  </main>

{% endblock %}
